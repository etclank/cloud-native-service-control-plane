apiVersion: v1
kind: Namespace
metadata:
  name: registry-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-smoke
  namespace: registry-validation
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-smoke
  namespace: registry-validation
  labels:
    app.kubernetes.io/name: registry-smoke
    app.kubernetes.io/component: infrastructure-validation
    app.kubernetes.io/version: sha-90e0703a4f6f9af60179328e1f0662ab59b28408
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-smoke
        app.kubernetes.io/component: infrastructure-validation
        app.kubernetes.io/version: sha-90e0703a4f6f9af60179328e1f0662ab59b28408
    spec:
      serviceAccountName: registry-smoke
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry-smoke
          image: ghcr.io/etclank/cloud-native-service-control-plane-registry-smoke@sha256:53019aa1ef2810c7d5e9085c31a0518bafd9bb48f1be61433883f0bdac206ca9
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: registry-smoke
  namespace: registry-validation
spec:
  selector:
    app.kubernetes.io/name: registry-smoke
  ports:
    - name: http
      port: 80
      targetPort: http
