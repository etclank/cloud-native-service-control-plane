apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-api-prometheus-metrics-ingress
  namespace: platform-system
  labels:
    app.kubernetes.io/name: control-plane-api
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: observability
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: managed-demo-prometheus-metrics-ingress
  namespace: applications
  labels:
    app.kubernetes.io/name: managed-service
    app.kubernetes.io/managed-by: platform-operator
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: managed-service
      app.kubernetes.io/managed-by: platform-operator
      platform.eoghanclancy.eu/template: demo-http
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: observability
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9090
