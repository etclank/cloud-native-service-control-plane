apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-api
  namespace: platform-system
  labels:
    app.kubernetes.io/name: control-plane-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cloud-native-service-control-plane
    spec:
      serviceAccountName: control-plane-api
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane-api
          image: ghcr.io/etclank/cloud-native-service-control-plane-api@sha256:22ffdf07c24af219a1fe493095c3293c480da4f3cdc04ccc167e65ae81d631ad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: API_TOKEN_FILE
              value: /var/run/secrets/control-plane-api/token
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: api-token
              mountPath: /var/run/secrets/control-plane-api
              readOnly: true
      volumes:
        - name: api-token
          secret:
            secretName: control-plane-api-token
            items:
              - key: token
                path: token
                mode: 0440
      terminationGracePeriodSeconds: 30
