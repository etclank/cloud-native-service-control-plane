# This NetworkPolicy allows only the H8.4C Prometheus Pod identity to access
# the authenticated controller-manager metrics endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: cloud-native-service-control-plane
    app.kubernetes.io/managed-by: kustomize
  name: prometheus-metrics-ingress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: cloud-native-service-control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: observability
              app.kubernetes.io/component: server
      ports:
        - port: 8443
          protocol: TCP
