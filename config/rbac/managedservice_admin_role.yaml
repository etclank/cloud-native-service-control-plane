# This rule is not used by the project platform-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over platform.eoghanclancy.eu.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-operator
    app.kubernetes.io/managed-by: kustomize
  name: managedservice-admin-role
rules:
- apiGroups:
  - platform.eoghanclancy.eu
  resources:
  - managedservices
  verbs:
  - '*'
- apiGroups:
  - platform.eoghanclancy.eu
  resources:
  - managedservices/status
  verbs:
  - get
