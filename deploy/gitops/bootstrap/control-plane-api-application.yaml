apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control-plane-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  project: platform-control-plane

  source:
    repoURL: git@github.com:etclank/cloud-native-service-control-plane.git
    targetRevision: f975f0b0d72797c370d855bf857a72b0f9234d79
    path: kubernetes/platform/control-plane-api

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=false

  revisionHistoryLimit: 10
