apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-operator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  project: platform-control-plane

  source:
    repoURL: git@github.com:etclank/cloud-native-service-control-plane.git
    targetRevision: main
    path: config/default

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=false

  revisionHistoryLimit: 10
