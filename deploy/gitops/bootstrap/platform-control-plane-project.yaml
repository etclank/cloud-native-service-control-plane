apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-control-plane
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  description: Restricted project for the portfolio platform control plane

  sourceRepos:
    - git@github.com:etclank/cloud-native-service-control-plane.git

  destinations:
    - namespace: platform-system
      server: https://kubernetes.default.svc
    - namespace: applications
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
