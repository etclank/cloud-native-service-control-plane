apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  project: observability

  source:
    repoURL: git@github.com:etclank/cloud-native-service-control-plane.git
    targetRevision: 34420d6c3a24e7a22d8b0a9cbb1e738dca08552c
    path: deploy/observability
    helm:
      releaseName: observability
      valueFiles:
        - values.yaml
        - values-h8.4b-candidate.yaml
      passCredentials: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    syncOptions:
      - CreateNamespace=false

  revisionHistoryLimit: 10
