apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartenergy
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloud-native-service-control-plane
spec:
  project: smartenergy

  source:
    repoURL: https://github.com/etclank/smartenergy-api.git
    targetRevision: 6dee39d597ce87620f4f12b17ea0bdc079d029f0
    path: deploy/kubernetes/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: smartenergy

  syncPolicy:
    syncOptions:
      - CreateNamespace=false

  revisionHistoryLimit: 10
