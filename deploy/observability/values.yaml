opentelemetry-collector:
  mode: daemonset
  fullnameOverride: opentelemetry-collector
  namespaceOverride: observability

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    digest: sha256:aa4509d8d72195c8576227fb33932788bc368fb0e81f6520f332130139236b91
    pullPolicy: IfNotPresent

  command:
    name: otelcol-k8s

  alternateConfig:
    exporters:
      nop: {}
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024
      memory_limiter:
        check_interval: 5s
        limit_mib: 144
        spike_limit_mib: 32
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [nop]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [nop]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [nop]

  serviceAccount:
    create: false
    name: opentelemetry-collector
    automountServiceAccountToken: false

  clusterRole:
    create: false

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001

  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: 0
      protocol: TCP
      appProtocol: grpc
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      hostPort: 0
      protocol: TCP
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: false

  service:
    enabled: false
  ingress:
    enabled: false
  httproute:
    enabled: false
  podMonitor:
    enabled: false
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  networkPolicy:
    enabled: false

  hostNetwork: false
  hostPID: false
  shareProcessNamespace: false

  rollout:
    strategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  extraContainers: []
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []

# Default values render the Collector foundation only. The checked-in Argo CD
# Application also loads values-h8.4b-candidate.yaml to enable Prometheus and
# kube-state-metrics with the seven reviewed scrape jobs.
prometheus:
  enabled: false

  rbac:
    create: false

  serviceAccounts:
    server:
      create: true
      name: prometheus-server
      automountServiceAccountToken: true

  server:
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      scrape_timeout: 10s

    image:
      repository: quay.io/prometheus/prometheus
      digest: sha256:bd2dcadfb0d1096e2a4c21817ac7af918e2f19ff628e4bf25fd67a924c13dd80

    replicaCount: 1
    automountServiceAccountToken: true
    enableServiceLinks: false
    hostNetwork: false

    strategy:
      type: Recreate
    terminationGracePeriodSeconds: 300

    retention: 72h
    retentionSize: 2GB
    extraFlags: []
    remoteWrite: []
    remoteRead: []

    persistentVolume:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClass: local-path
      size: 3Gi
      mountPath: /data

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      capabilities:
        drop:
          - ALL

    service:
      enabled: true
      type: ClusterIP
      servicePort: 80
      gRPC:
        enabled: false

  serverFiles:
    alerting_rules.yml: null
    alerts: null
    recording_rules.yml: null
    rules: null
    prometheus.yml:
      rule_files: []

  configmapReload:
    prometheus:
      enabled: false

  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
    prometheus-self:
      enabled: true
      scheme: http
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      static_configs:
        - targets:
            - 127.0.0.1:9090
    kube-state-metrics:
      enabled: true
      scheme: http
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      kubernetes_sd_configs:
        - role: endpointslice
          namespaces:
            names:
              - observability
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_namespace
          action: keep
          regex: ^observability$
        - source_labels:
            - __meta_kubernetes_service_name
          action: keep
          regex: ^observability-kube-state-metrics$
        - source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_name
            - __meta_kubernetes_service_label_app_kubernetes_io_instance
            - __meta_kubernetes_service_label_app_kubernetes_io_component
          action: keep
          regex: ^kube-state-metrics;observability;metrics$
        - source_labels:
            - __meta_kubernetes_endpointslice_port_name
          action: keep
          regex: ^http$
        - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_conditions_ready
          action: keep
          regex: ^true$
        - source_labels:
            - __meta_kubernetes_namespace
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_service_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: service
        - source_labels:
            - __meta_kubernetes_pod_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: pod
    platform-operator:
      enabled: true
      scheme: https
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        insecure_skip_verify: true
      kubernetes_sd_configs:
        - role: endpointslice
          namespaces:
            names:
              - platform-system
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_namespace
          action: keep
          regex: ^platform-system$
        - source_labels:
            - __meta_kubernetes_service_name
          action: keep
          regex: ^platform-operator-controller-manager-metrics-service$
        - source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_name
            - __meta_kubernetes_service_label_control_plane
          action: keep
          regex: ^cloud-native-service-control-plane;controller-manager$
        - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_control_plane
          action: keep
          regex: ^cloud-native-service-control-plane;controller-manager$
        - source_labels:
            - __meta_kubernetes_endpointslice_port_name
          action: keep
          regex: ^https$
        - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_conditions_ready
          action: keep
          regex: ^true$
        - source_labels:
            - __meta_kubernetes_namespace
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_service_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: service
        - source_labels:
            - __meta_kubernetes_pod_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: pod
    opentelemetry-collector:
      enabled: true
      scheme: http
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      kubernetes_sd_configs:
        - role: endpointslice
          namespaces:
            names:
              - observability
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_namespace
          action: keep
          regex: ^observability$
        - source_labels:
            - __meta_kubernetes_service_name
          action: keep
          regex: ^opentelemetry-collector$
        - source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_name
            - __meta_kubernetes_service_label_app_kubernetes_io_part_of
          action: keep
          regex: ^opentelemetry-collector;cloud-native-service-control-plane$
        - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_app_kubernetes_io_instance
            - __meta_kubernetes_pod_label_component
          action: keep
          regex: ^opentelemetry-collector;observability;agent-collector$
        - source_labels:
            - __meta_kubernetes_endpointslice_port_name
          action: keep
          regex: ^metrics$
        - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_conditions_ready
          action: keep
          regex: ^true$
        - source_labels:
            - __meta_kubernetes_namespace
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_service_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: service
        - source_labels:
            - __meta_kubernetes_pod_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: pod
    control-plane-api:
      enabled: true
      scheme: http
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      kubernetes_sd_configs:
        - role: endpointslice
          namespaces:
            names:
              - platform-system
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_namespace
          action: keep
          regex: ^platform-system$
        - source_labels:
            - __meta_kubernetes_service_name
          action: keep
          regex: ^control-plane-api$
        - source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_name
            - __meta_kubernetes_service_label_app_kubernetes_io_part_of
          action: keep
          regex: ^control-plane-api;cloud-native-service-control-plane$
        - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_app_kubernetes_io_component
          action: keep
          regex: ^control-plane-api;api$
        - source_labels:
            - __meta_kubernetes_endpointslice_port_name
          action: keep
          regex: ^metrics$
        - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_conditions_ready
          action: keep
          regex: ^true$
        - source_labels:
            - __meta_kubernetes_namespace
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_service_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: service
        - source_labels:
            - __meta_kubernetes_pod_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: pod
    managed-demo:
      enabled: true
      scheme: http
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      kubernetes_sd_configs:
        - role: endpointslice
          namespaces:
            names:
              - applications
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_namespace
          action: keep
          regex: ^applications$
        - source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_name
            - __meta_kubernetes_service_label_app_kubernetes_io_managed_by
            - __meta_kubernetes_service_label_platform_eoghanclancy_eu_template
          action: keep
          regex: ^managed-service;platform-operator;demo-http$
        - source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
            - __meta_kubernetes_pod_label_app_kubernetes_io_managed_by
            - __meta_kubernetes_pod_label_platform_eoghanclancy_eu_template
          action: keep
          regex: ^managed-service;platform-operator;demo-http$
        - source_labels:
            - __meta_kubernetes_endpointslice_port_name
          action: keep
          regex: ^metrics$
        - source_labels:
            - __meta_kubernetes_endpointslice_endpoint_conditions_ready
          action: keep
          regex: ^true$
        - source_labels:
            - __meta_kubernetes_namespace
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: namespace
        - source_labels:
            - __meta_kubernetes_service_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: service
        - source_labels:
            - __meta_kubernetes_pod_name
          action: replace
          regex: ^(.+)$
          replacement: $1
          target_label: pod

    smartenergy-api:
      enabled: true
      scheme: http
      metrics_path: /metrics
      scrape_interval: 30s
      scrape_timeout: 10s
      kubernetes_sd_configs:
        - role: endpointslice
          namespaces:
            names:
              - smartenergy
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_namespace
          action: keep
          regex: ^smartenergy$
        - source_labels:
            - __meta_kubernetes_service_name
          action: keep
          regex: ^smartenergy-api$
        - source_labels:
            - __meta_kubernetes_service_label_app_kubernetes_io_name
            - __meta_kubernetes_service_label_app_kubernetes_io_component
