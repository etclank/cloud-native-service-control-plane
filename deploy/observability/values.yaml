kube-state-metrics:
  enabled: false

  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.19.1
    sha: sha256:7661da8c99b733d43117e4cba12bd9865d335e5777191d0af3d789807aded9f4

  kubeRBACProxy:
    enabled: false

  rbac:
    create: false

  serviceAccount:
    create: true
    name: kube-state-metrics
    automountServiceAccountToken: true
  automountServiceAccountToken: true

  replicas: 1
  updateStrategy: Recreate
  hostNetwork: false

  service:
    type: ClusterIP
    port: 8080

  collectors:
    - daemonsets
    - deployments
    - namespaces
    - nodes
    - persistentvolumeclaims
    - pods
    - replicasets
    - statefulsets

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: null
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    capabilities:
      drop:
        - ALL

  prometheusScrape: false
  selfMonitor:
    enabled: false
  prometheus:
    monitor:
      enabled: false

# H8.4B0 proved that this K3s kube-router dataplane evaluates Kubernetes
# Service egress after DNAT. Review this exact endpoint again after node
# replacement, node readdressing, API EndpointSlice changes, or K3s network
# reconfiguration. This value renders policy only when the relevant dependency
# is enabled. Override it for a different cluster.
networkPolicyDestinations:
  kubernetesAPI:
    cidr: 142.132.178.45/32
    port: 6443
