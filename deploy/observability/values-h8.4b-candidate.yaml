# Enabled observability overlay used by the checked-in Argo CD Application.
# The historical filename is retained for compatibility with pinned revisions
# and render tests. Base values alone keep both dependencies disabled.
opentelemetry-collector:
  alternateConfig:
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
  ports:
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

prometheus:
  enabled: true

kube-state-metrics:
  enabled: true
